# =============================================================================
# TITAN Fall — world configuration
#
# This file defines the game world: rooms, robots, items, lasers, terminals
# and doors. tools/genworld.py turns it into src/world.asm (data tables only,
# no code) as part of the build — run `make` after editing.
#
# Coordinates are player/robot tile coordinates (X 0..max_x, Y 0..max_y per
# room). Door rectangles sit one tile OUTSIDE the walkable range (e.g. x: -1
# for a left wall, y: 10 for a bottom wall): a door triggers when a move
# would land inside its rectangle.
# =============================================================================

game:
  start_room: room1
  start_time: "05:47:33"        # countdown clock at mission start (h:mm:ss)
  death_penalty_minutes: 30     # time lost per death (Impossible Mission style)

# Actor types: name, sprite data label (defined in src/titanfall.asm), sprite
# colour, and AI routine used while computer-controlled. "human" is reserved
# for the player and never appears in a room's robot list.
actor_types:
  human:
    sprite: SPR_PLAYER
    color: cyan
  sentry:
    sprite: SPR_ROBOT
    color: orange
    ai: patrol
  splicer:
    sprite: SPR_ROBOT2
    color: green
    ai: patrol

# Hidden items. Key order defines the item index (ITEM_* equates in world.asm).
# label: shown in the status line (max 12 chars).
# found_text: popup message when searched (max 30 chars).
# Runtime state per item: 0=hidden 1=carried 2=used.
items:
  red_card:
    name: red access card
    label: red
    found_text: red access card found!

rooms:
  - name: room1
    vchar64_map: graphics/titan_room01-map.s
    bounds: {max_x: 12, max_y: 9}     # room 1 is the full 320px wide (13 tiles)
    player_start: {x: 4, y: 4}
    map_view: {row: 9, col: 2, width: 12, height: 4}   # highlight box on the sector map
    robots:
      - type: sentry
        start: {x: 2, y: 7}
        patrol: [{x: 2, y: 7}, {x: 4, y: 7}]
      - id: bot3312                    # referenced by the terminal menu (ACTOR_BOT3312)
        type: splicer
        start: {x: 7, y: 3}
        patrol: [{x: 7, y: 3}, {x: 9, y: 3}]
    things:
      - item: red_card
        at: {x: 9, y: 5}
    lasers:
      - {x1: 6, y1: 0, x2: 6, y2: 9}   # vertical laser wall; splicer can burn it out
    terminals:
      - {x1: 1, y1: 3, x2: 3, y2: 5}   # press space inside this zone
    doors:
      - at: {x1: -1, y1: 5, x2: -1, y2: 6}   # left wall opening
        leads_to: room2
        arrive: {x: 9}                 # y omitted = keep current y

  - name: room2
    vchar64_map: graphics/titan_room02-map.s
    bounds: {max_x: 9, max_y: 9}
    player_start: {x: 8, y: 5}
    map_view: {row: 9, col: 20, width: 12, height: 5}
    robots:
      - type: sentry
        start: {x: 2, y: 5}
        patrol: [{x: 2, y: 5}, {x: 7, y: 5}]
    doors:
      - at: {x1: 10, y1: 5, x2: 10, y2: 6}   # right wall, back to room 1
        leads_to: room1
        arrive: {x: 0}
      - at: {x1: 4, y1: 10, x2: 6, y2: 10}   # bottom wall — mission exit
        leads_to: exit                 # special: win screen
        key: red_card                  # locked (popup) without this item
