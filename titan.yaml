# =============================================================================
# TITAN Fall — world configuration
#
# This file defines the game world: rooms, robots, items, lasers and doors.
# tools/genworld.py turns it into src/world.asm (data tables only, no code)
# as part of the build — run `make` after editing. Walls and terminals are
# found in the room art (see art: below), and the sector map is drawn from
# the doors.
#
# Coordinates are tile coordinates. One tile = 2x2 characters of room art
# (16x16 px), so a room is 20x11 tiles: tile (x, y) covers map columns
# 2x..2x+1 and rows 2y..2y+1, X 0..19, Y 0..10. A sprite standing on a tile
# is centred on it horizontally with its feet on the tile's bottom line.
# Door rectangles sit one tile OUTSIDE the room (x: -1 / x: 20 for the left
# / right edge, y: -1 / y: 11 for top / bottom): a door triggers when a move
# would land inside its rectangle.
# =============================================================================

game:
  start_room: room5
  start_time: "05:47:33"        # countdown clock at mission start (h:mm:ss)
  death_penalty_minutes: 30     # time lost per death (Impossible Mission style)
  robot_link_seconds: 30        # a terminal link to a robot expires after this (1-99)
  reset_keys: 0                 # reset keys at the start (0-9); more are won at
                                # terminals in the carrier lock mini-game
  reset_penalty_minutes: 10     # F1 -> R without a reset key costs this (1-59)

# Room-art screen codes the game needs to know about (shared charset, see
# graphics/). When a laser is destroyed its beam/emitter chars under the laser
# rectangle are repainted: with the char on both sides if they match (a beam
# crossing a wall keeps the wall), else with floor_tile.
art:
  floor_tile: 0x80
  laser_tiles: [0x81, 0x82, 0x83]      # beam, top emitter, bottom emitter
  # Wall chars. A tile is solid if any of its 2x2 chars is one of these;
  # the build computes the wall map from the art and rejects starts,
  # patrols, items or door arrivals inside a wall.
  solid_tiles: [0x84, 0x85, 0x86, 0x87, 0x88, 0x89, 0x8a, 0x8b,
                0xa4,                  # 0xa4: the missile bay's "keep out" border
                0xa6,                  # 0xa6: the power cell (also a win target)
                0xae,                  # 0xae: laser trap (sits in a wall)
                0xb3]                  # 0xb3: laser emitter (sits in a wall)
  # Crate chars (left/right half). A crate drawn on a whole tile (2x2 chars
  # at cols 2x..2x+1, rows 2y..2y+1) is movable: solid, but a player-driven
  # robot whose type has push: true pushes it one tile ahead (onto plain
  # floor only). Crate chars that don't fill a whole tile are fixed walls
  # (the build warns). All movable crates must be drawn the same way.
  crate_tiles: [0xab, 0xad]
  # Pit chars. A tile with any of these is a pit: the player who steps in
  # falls (the sprite vanishes) and dies; robots treat it as a wall, and it
  # blocks their sight; bolts fly over it. Nothing may be placed on one.
  pit_tiles: [0xac]
  # Terminal chars. Every group of these in a room's art is a terminal,
  # used with fire from its own tiles or any tile next to them.
  terminal_tiles: [0x8c, 0x8d, 0x8e, 0x8f]
  # Laser trap chars. A trap fires down its char column (with the first
  # laser_tiles char, the beam) when the player steps onto a tile below it,
  # up to the first solid tile -- a wall or a crate blocks it (push the
  # crate away and the beam reaches further), a pit doesn't. Above the
  # blocker the player is fried; below it it's safe. Robots aren't hit.
  trap_tiles: [0xae]
  # Pressure plates and gates. A tile with a plate char is a pressure plate
  # (walkable); the gate chars of a room are its gate (solid while closed).
  # The gate is open while every plate in the room is loaded -- by the
  # player, a robot or a crate -- and shuts again when one is emptied, unless
  # something stands in it. Walking into the open gate latches it open for
  # good (so the room behind it can't be shut off). goal done: {gate: room}.
  plate_tiles: [0xb1]
  gate_tiles: [0xb2]
  # Laser emitters, mirrors and targets. An emitter (in an outer wall, at most
  # one per room) fires a beam into the room all the time; it kills the player
  # and robots. Mirrors are movable like crates (pushed by a push: robot) and
  # are drawn as a whole tile with these chars (top left, top right, bottom
  # left, bottom right); they turn the beam. A wall or crate stops it. When it
  # hits the room's target, the target is destroyed and the room's gate
  # latches open.
  emitter_tiles: [0xb3]
  target_tiles: [0xb8]
  shutter_tiles: [0xbf]                # timed shutters (a room's shutters: list)
  # Toggle switches and red/green blocks (2x2 tiles, TL TR BL BR). A switch
  # flips when the human, a non-flying robot or a pushed crate enters it; all
  # switches of a room share one state. Red blocks are up (solid) while it's
  # off, green ones while it's on. A block rising under the human kills, under
  # a robot destroys it; a crate on it jams it down. Resets with the room.
  switch: {off: [0xc5, 0xc5, 0xc4, 0xc4], on: [0xc4, 0xc4, 0xc6, 0xc6]}
  blocks:
    red_up: [0xc5, 0xc5, 0xc5, 0xc5]
    green_up: [0xc6, 0xc6, 0xc6, 0xc6]
    red_down: [0xc7, 0xc7, 0xc7, 0xc7]
    green_down: [0xc8, 0xc8, 0xc8, 0xc8]
  beam_h_tile: 0xb4                    # the horizontal beam (vertical: laser_tiles[0])
  mirrors:
    slash: [0xb5, 0xb6, 0xb6, 0xb5]    # /
    backslash: [0xb7, 0xb5, 0xb5, 0xb7]  # \
  # Closed-door chars. A door with a key: is drawn with these in the room's
  # edge row(s) at the door; walking into it with the key turns them into
  # floor_tile (the door opens), and the next push goes through.
  door_tiles: [0xa3, 0xb0]            # 0xa3 in a top/bottom wall, 0xb0 in a side wall
  # Win targets: a bolt fired by a player-driven shooter robot that enters a
  # tile containing any of these chars wins the game (the power cell).
  win_tiles: [0xa6]
  # The missile: on game over its room is shown (no sprites) and these chars
  # fly up off the screen, leaving the art around them. All in one room.
  missile_tiles: [0xa5, 0xa7, 0xa8, 0xc3, 0xdf, 0xe9]
  # The launch interlock (one room): a key slot per launch key (a 2x2 tile
  # of slot chars, lit when a key is turned in it), nested barrier layers
  # around the release console -- one layer opens per key, outermost first,
  # any slot, any order -- and the console, which opens the room's sealed:
  # door. All solid. Slots = launch_key items >= layers; with more keys
  # than layers the first keys turned open no layer (the last opens the
  # innermost), so the console always needs every key.
  interlock:
    slot: 0xb9
    slot_lit: 0xba
    layers: [0xbb, 0xbc, 0xbd]         # outermost first
    console: 0xbe

# Actor types: name, sprite set (src/c64_*_sprites.asm, included by src/titanfall.asm),
# colour, and AI routine used while computer-controlled. "human" is reserved
# for the player and never appears in a room's robot list.
actor_types:
  # sprite:     label of the type's first frame (src/c64_*_sprites.asm); frames
  #             follow as 3 per facing (rest/walk1/walk2), facings in
  #             down/up/left/right order
  # directions: 4 = down/up/left/right, 2 = left/right only (the type's
  #             down/up frames aren't assembled; vertical moves keep facing)
  # anim:       walk = animates while stepping, hover = always animating
  # A robot's behaviour while not player-driven has two independent parts,
  # set per type and overridable per robot entry:
  # idle:       what it does while it doesn't see the player (default patrol)
  #             patrol = shuttle between the robot's two patrol: waypoints
  #                      (no patrol: = stand still -- at its start, or
  #                      wherever a terminal link left it)
  #             roam   = wander the whole room: a random direction for 2-9
  #                      tiles, then another; a wall, the room's edge or a
  #                      laser makes it pick a new direction. Takes no patrol:
  # attack:     what it does while it sees the player — on the same tile
  #             row with no wall in between (default none)
  #             none       = nothing, it keeps idling
  #             rush       = charge along the row at double speed
  #             shoot      = stop and fire a bolt along the row (one bolt in
  #                          flight at a time, shared by all); a player-driven
  #                          shooter fires too
  #             forcefield = raise a force field toward the player and
  #                          advance at normal speed -- this one looks along
  #                          the axis it moves on: its row (both ways) when
  #                          moving left/right, its column when moving
  #                          up/down (vertical field)
  #             A patrolling robot with rush or forcefield needs a horizontal
  #             patrol through its start (it walks back along its row).
  # color:      the multicolour sprite's own colour (%10 pixels); black and
  #             light grey are shared by all sprites ($D025/$D026)
  # push:       true = pushes crates (art.crate_tiles) while player-driven
  # fly:        true = flies over pits (art.pit_tiles) while player-driven
  # jump:       true = driven, standing still with fire held for 2 s charges
  #             it (it flashes, then turns white): the next two moves are
  #             2-tile jumps over floor, a pit or a laser. By itself it now
  #             and then hops two tiles over floor
  # robodex:    the type's page in the terminal's robodex (robot information):
  #             name: and type: (max 20 chars each), notes: (what it does) and
  #             linked: (what it does when you drive it; drawn after a
  #             "linked:" label) -- prose, word-wrapped to 26 chars, 5 lines
  #             for both together. Types without one aren't listed; a page
  #             shows once a robot of the type is in a visited room
  human:
    sprite: sprite_down_rest
    color: ltred
  sentry:
    sprite: robot_down_rest
    color: orange
    robodex:
      name: sentry
      type: armed guard
      notes: patrols a short beat and fires bolts along its row when it sees you.
      linked: fire shoots a bolt the way it faces.
  splicer:
    sprite: robot_down_rest
    color: green
  dozer:                               # tracked construction robot
    sprite: dozer_down_rest
    push: true                         # driven, it pushes crates
    color: yellow
    robodex:
      name: dozer
      type: construction unit
      notes: harmless, slow and strong.
      linked: it can push heavy items around.
  tripod:
    sprite: tripod_down_rest
    color: ltgreen
    robodex:
      name: tripod
      type: security walker
      notes: >-
        watches the line it walks along. some charge at intruders, others
        raise a force field. touching it kills.
  drone:
    sprite: drone_down_hover
    anim: hover
    fly: true                          # driven, it hovers over pits
    color: yellow
    robodex:
      name: drone
      type: flying scout
      notes: roams the room and rushes at intruders on its row.
      linked: it flies, and is heavy enough to hold a pressure plate.
  hopper:                              # spring hopper robot
    sprite: hopper_down_rest
    anim: hop                          # hover (rest/crouch/rest/leap, always
                                       #  bouncing), 4 frames per facing: the
                                       #  charged pose while charged
    jump: true                         # charged double jumps, random hops
    color: purple
    robodex:
      name: hopper
      type: spring jumper
      linked: >-
        stand still and hold fire for 2 seconds to charge it (it turns
        white). the next two moves are jumps over obstacles.

# Security codes: one-letter code types and how many the player starts with
# (0-9, at most 3 types). Every robot names the code its terminal link
# costs (code: a / b / none); linking spends one. More can be hidden as
# items with code: <letter> (finding one adds one).
security_codes:
  a: 2
  b: 0

# Hidden items. Key order defines the item index (ITEM_* equates in world.asm).
# An item that's neither a code nor a launch key is a card: a card glyph
# after "card" on the status line, grey until found, then in its color:
# (a C64 colour name, default white).
# found_text: popup message when searched (max 30 chars).
# code: <letter> makes it a security code instead (adds one to that
#   code's count; default found_text "security code <letter> found!").
# Runtime state per item: 0=hidden 1=carried 2=used.
items:
  red_card:
    name: red access card
    color: red                         # its glyph on the status line, once found
    found_text: red access card found!
  code_b1:
    code: b                            # room 14's vault: the only B, for the silo guard
  code_a1:
    code: a                            # in the entrance's cabinet
  blue_card:
    name: blue access card
    color: blue
    found_text: blue access card found!
  code_a2:
    code: a                            # room 10's cabinet: pays for the room 10/11 dozers
  code_a3:
    code: a                            # room 13's bench, top left (a bonus)
  code_a4:
    code: a                            # room 8's cabinet
  code_a5:
    code: a                            # room 15's vault: pays back the sentry's link
  code_a6:
    code: a                            # room 11's bookshelf, bottom left (a bonus)
  code_a7:
    code: a                            # room 3's cabinet, top (a bonus)
  code_a8:
    code: a                            # room 16's cabinet, top left (a bonus)
  # launch_key: true = a key for the launch interlock (art.interlock); the
  # status line counts the ones carried ("keys 2") instead of the card slot
  launch_key_1:                        # optics
    launch_key: true
    found_text: launch key found!
  launch_key_2:                        # maze
    launch_key: true
    found_text: launch key found!
  launch_key_3:                        # vault
    launch_key: true
    found_text: launch key found!
  launch_key_4:                        # moat
    launch_key: true
    found_text: launch key found!

# Rooms. goal: is the room's line of orders, shown on row 1 as "orders:
# <text>" while the player is in the room (max 25 chars). Optional done:
# names when it's achieved — then " - done" is added and it turns green:
#   found: <item>     the item has been found (or a list of two: both)
#   opened: <room>    this room's keyed door to <room> has been opened
#   visited: <room>   the player has been in <room>
rooms:
  - name: room1
    vchar64_map: graphics/titan-map01.s
    label: lasers                      # name on the sector map (default: name)
    # bounds: {max_x: 19, max_y: 10}   # optional; default is the whole room
    player_start: {x: 6, y: 4}
    goal: {text: find red card, done: {found: red_card}}
    # Robots: name is shown in the terminal menu (max 22 chars; default: id
    # or type); locked: true lists it there but refuses the link.
    robots:
      - type: sentry
        name: bot-5150  sentry
        locked: true
        code: b                        # the link costs a security code b
        attack: shoot                  # shoots bolts along its row at you
        start: {x: 3, y: 7}
        patrol: [{x: 3, y: 7}, {x: 6, y: 7}]
      - id: bot3312                    # referenced by the terminal menu (ACTOR_BOT3312)
        type: dozer
        name: bot-3312  dozer
        code: a
        start: {x: 11, y: 4}
        patrol: [{x: 11, y: 4}, {x: 14, y: 4}]   # y=3 at x=14 is inside a wall
    things:
      - item: red_card
        at: {x: 14, y: 5}
    lasers:
      - {x1: 9, y1: 0, x2: 9, y2: 10}  # vertical laser wall; splicer can burn it out
    doors:
      - at: {x1: -1, y1: 8, x2: -1, y2: 8}   # left wall opening, to the range
        leads_to: room15
        arrive: {x: 19}                # y omitted = keep current y

  - name: room2
    vchar64_map: graphics/titan-map02.s
    label: hub
    player_start: {x: 17, y: 5}
    goal: {text: open blast door, done: {opened: room12}}   # the keyed door to room 12
    robots:
      - type: drone
        name: bot-8808  drone
        code: a
        idle: roam                     # wanders the whole room
        attack: rush                   # rushes you when you're on its row
        start: {x: 3, y: 5}
    doors:
      - at: {x1: 20, y1: 8, x2: 20, y2: 8}   # right wall, to room 15
        leads_to: room15
        arrive: {x: 0}
      - at: {x1: -1, y1: 5, x2: -1, y2: 6}   # left wall opening, to room 14
        leads_to: room14
        arrive: {x: 19}
      - at: {x1: 6, y1: -1, x2: 10, y2: -1}  # top wall opening (cols 12-21)
        leads_to: room3
        arrive: {y: 10}                # x omitted = keep current x
      - at: {x1: 6, y1: 11, x2: 10, y2: 11}  # bottom wall: the closed door (0xa3)
        leads_to: room12
        arrive: {y: 0}
        key: red_card                  # locked (popup) without it; opens with it

  - name: room3
    vchar64_map: graphics/titan-map03.s
    label: hall
    player_start: {x: 8, y: 9}
    goal: {text: find blue card, done: {found: blue_card}}
    robots:
      - type: tripod
        name: bot-4410  tripod
        code: a
        idle: roam                     # wanders the hall
        attack: forcefield             # advances behind a force field when it sees you
        start: {x: 14, y: 7}
    things:
      - item: blue_card                # the furniture, bottom left
        at: {x: 1, y: 9}
      - item: code_a7                  # the cabinet at the top (not in the goal)
        at: {x: 4, y: 1}
    doors:
      - at: {x1: 6, y1: 11, x2: 10, y2: 11}  # bottom wall opening, back to room 2
        leads_to: room2
        arrive: {y: 0}
      - at: {x1: 20, y1: 5, x2: 20, y2: 6}   # right wall opening, to room 6
        leads_to: room6
        arrive: {x: 0}
      - at: {x1: -1, y1: 5, x2: -1, y2: 6}   # left wall opening, to the entrance
        leads_to: room5
        arrive: {x: 18, y: 5}          # inside the switch door (it may be shut)

  - name: room4
    vchar64_map: graphics/titan-map04.s
    label: silo                        # map labels: max 6 chars (8 rooms in a 4x4 grid)
    player_start: {x: 8, y: 5}
    goal: {text: disable missile}       # done = the game is won
    robots:
      - type: sentry
        name: bot-6060  guard
        code: b
        attack: shoot                  # fires bolts along row 5 at you
        start: {x: 10, y: 5}
        patrol: [{x: 10, y: 5}, {x: 4, y: 5}]   # x 1-3 is the (solid) power cell
    doors:
      - at: {x1: -1, y1: 9, x2: -1, y2: 9}   # left wall opening, back to the arcade
        leads_to: room9
        arrive: {x: 19}

  - name: room5
    vchar64_map: graphics/titan-map05.s
    label: entry
    player_start: {x: 7, y: 1}         # in the corridor by the exit sign
    goal: {text: enter complex, done: {visited: room3}}
    robots:
      - type: sentry
        name: bot-2020  sentry
        code: a
        attack: shoot                  # fires bolts along row 7 at you
        start: {x: 1, y: 7}
        patrol: [{x: 1, y: 7}, {x: 4, y: 7}]   # the short corridor, left
    things:
      - item: code_a1                  # the cabinet, bottom right
        at: {x: 17, y: 9}
    doors:
      - at: {x1: 20, y1: 4, x2: 20, y2: 5}   # right wall: the switch door, to room 3
        leads_to: room3
        arrive: {x: 0, y: 5}           # y 4 at room 3's left edge is wall
        switch: true                   # open while the switch at (18,2) is on

  - name: room6
    vchar64_map: graphics/titan-map06.s
    label: trap
    player_start: {x: 10, y: 5}
    goal: {text: get past the trap, done: {visited: room16}}
    robots:
      - type: tripod
        name: bot-6161  tripod
        code: a
        idle: roam                     # wanders the whole room
        attack: rush                   # rushes you when you're on its row
        start: {x: 14, y: 8}
    doors:
      - at: {x1: -1, y1: 5, x2: -1, y2: 6}   # left wall opening, back to room 3
        leads_to: room3
        arrive: {x: 19}
      - at: {x1: 20, y1: 4, x2: 20, y2: 5}   # right wall opening, to room 7
        leads_to: room7
        arrive: {x: 0}
      - at: {x1: 12, y1: -1, x2: 16, y2: -1} # top wall opening, to room 16
        leads_to: room16
        arrive: {y: 10}

  - name: room7
    vchar64_map: graphics/titan-map07.s
    label: maze
    player_start: {x: 18, y: 4}
    goal: {text: find launch key, done: {found: launch_key_2}}
    robots:
      - type: dozer                    # pushes the crates out of the way
        name: bot-7070  dozer
        code: a
        start: {x: 2, y: 9}            # the pocket, bottom left; no patrol:
                                       #  stays where the player leaves it
      - type: hopper
        name: bot-7171  hopper
        code: a
        locked: true                   # can't be linked at the terminal
        idle: roam                     # hops around the maze, harmless
        start: {x: 16, y: 9}           #  (but touching it still kills)
    things:
      - item: launch_key_2             # top left, past the crates
        at: {x: 1, y: 1}
    doors:
      - at: {x1: -1, y1: 4, x2: -1, y2: 5}   # left wall opening, back to room 6
        leads_to: room6
        arrive: {x: 19}

  - name: room8
    vchar64_map: graphics/titan-map08.s
    label: vault
    player_start: {x: 14, y: 8}
    # The upper half (through the gap on the right) is guarded by a sentry
    # shooting along row 3, where the cabinet with the code is. It can't be
    # taken over; the laser traps in the top wall can fry it: stand under
    # the crate at (9,4) or (5,4) -- the beam comes on, you're safe behind
    # the crate -- and wait for the sentry to walk through the beam.
    goal: {text: find code and key, done: {found: [code_a4, launch_key_3]}}
    robots:
      - type: sentry
        name: bot-9090  sentry
        locked: true
        code: b
        attack: shoot                  # fires bolts along row 3
        start: {x: 12, y: 3}
        patrol: [{x: 12, y: 3}, {x: 2, y: 3}]   # (13,3) is a crate
    things:
      - item: code_a4                  # the cabinet, far left on row 3
        at: {x: 1, y: 3}
      - item: launch_key_3             # the cabinet by the top wall
        at: {x: 10, y: 1}
    doors:
      - at: {x1: -1, y1: 8, x2: -1, y2: 8}   # left wall opening (only tile row 8
        leads_to: room16                     #  is open: the art's rows 15-18)
        arrive: {x: 19}

  - name: room9                        # between the interlock and the silo; the arcade room
    vchar64_map: graphics/titan-map09.s
    label: arcade
    player_start: {x: 1, y: 5}
    # The arcade room: a serpentine (walls at x=5, 10, 15 with their gaps at
    # the bottom, top, bottom) with crates for cover, and four robots to
    # dodge. No terminal and no goal -- it resets whenever you leave.
    robots:
      - type: sentry                   # corridor 1: shoots along row 5
        name: bot-9101  sentry
        code: a
        attack: shoot
        start: {x: 6, y: 5}
        patrol: [{x: 6, y: 5}, {x: 9, y: 5}]
      - type: tripod                   # corridor 2: force field along row 4
        name: bot-9102  tripod
        code: a
        attack: forcefield
        start: {x: 14, y: 4}
        patrol: [{x: 14, y: 4}, {x: 11, y: 4}]
      - type: drone                    # anywhere: charges along your row
        name: bot-9103  drone
        code: a
        idle: roam
        attack: rush
        start: {x: 2, y: 1}
      - type: sentry                   # the last stretch: up and down by the exit
        name: bot-9104  sentry
        code: a
        attack: shoot
        start: {x: 17, y: 1}
        patrol: [{x: 17, y: 1}, {x: 17, y: 9}]
    doors:
      - at: {x1: -1, y1: 5, x2: -1, y2: 6}   # left wall opening, back to the interlock
        leads_to: room12
        arrive: {x: 19}
      - at: {x1: 20, y1: 9, x2: 20, y2: 9}   # right wall opening, to the silo
        leads_to: room4
        arrive: {x: 0}

  - name: room10                       # left of room 8 (top row of the map)
    vchar64_map: graphics/titan-map10.s
    label: plates
    player_start: {x: 18, y: 8}
    # Pressure plates: the gate in front of the doorway to room 11 opens
    # while both plates -- (5,8) and (14,8) -- are loaded. You can't stand on
    # one and walk through, so the dozer pushes the crate onto one plate and
    # parks on the other. Don't push the crate along row 5: the pit at (8,5)
    # swallows it (a death or leaving the room resets it).
    goal: {text: open the gate, done: {gate: room10}}
    robots:
      - type: dozer
        name: bot-1010  dozer
        code: a
        start: {x: 15, y: 4}           # no patrol: stays where you leave it
    things:
      - item: code_a2                  # the cabinet, top left
        at: {x: 1, y: 3}
    doors:
      - at: {x1: 20, y1: 8, x2: 20, y2: 8}   # right wall opening, to room 16
        leads_to: room16
        arrive: {x: 0}
      - at: {x1: -1, y1: 7, x2: -1, y2: 8}   # left wall opening (behind the gate)
        leads_to: room11
        arrive: {x: 19}

  - name: room11                       # left of room 10, the far end
    vchar64_map: graphics/titan-map11.s
    label: optics
    player_start: {x: 18, y: 7}
    # Laser and mirrors: the emitter in the left wall fires along row 5. Push
    # the / mirror up into (10,5) -- the beam turns up and row 5 frees on the
    # right -- then the \ mirror left into (10,2): the beam runs along row 2
    # into the target at (4,2), and the chamber's gate (top right) opens.
    goal: {text: find launch key, done: {found: launch_key_1}}
    robots:
      - type: dozer
        name: bot-1111  dozer
        code: a
        start: {x: 14, y: 8}
    things:
      - item: launch_key_1             # the cabinet in the chamber, top right
        at: {x: 18, y: 1}
      - item: code_a6                  # the bookshelf, bottom left (not in the goal)
        at: {x: 1, y: 9}
    doors:
      - at: {x1: 20, y1: 7, x2: 20, y2: 8}   # right wall opening, back to room 10
        leads_to: room10
        arrive: {x: 0}

  - name: room12                       # below the hub, left of the arcade
    vchar64_map: graphics/titan-map12.s
    label: lock
    player_start: {x: 8, y: 0}
    # The launch interlock: turn a launch key in each of the four slots
    # (any order). The first key only powers the cage up; the next three
    # each open one ring of it, outermost first. Then walk into the release
    # console in the middle: it opens the sealed door to the silo.
    goal: {text: release the silo door, done: {opened: room9}}
    robots:
      - type: tripod
        name: bot-1212  tripod
        code: a
        locked: true                   # (no terminal here anyway)
        idle: roam
        attack: forcefield
        start: {x: 16, y: 2}
    doors:
      - at: {x1: 6, y1: -1, x2: 10, y2: -1}  # top wall opening, back to the hub
        leads_to: room2
        arrive: {y: 10}
      - at: {x1: 20, y1: 5, x2: 20, y2: 6}   # right wall: the sealed door to the arcade
        leads_to: room9
        arrive: {x: 0}
        sealed: true                   # only the release console opens it

  - name: room13                       # below hops (bottom left corner)
    vchar64_map: graphics/titan-map13.s
    label: moat
    player_start: {x: 14, y: 0}
    # Two robots working together: the island in the middle sits in a moat
    # of pits two tiles wide. The drone flies over pits but can't push; the
    # dozer pushes crates but is shut in its pen behind the gate (5,6). Fly
    # the drone onto the island's plate (the gate opens and stays open while
    # the drone stays there), then drive the dozer out pushing crate (3,6)
    # along row 6 into the moat, push crate (2,5) down onto row 6 and after
    # it: the bridge from (6,6) to the island's cabinet.
    goal: {text: find launch key, done: {found: launch_key_4}}
    robots:
      - id: bot1313
        type: drone
        name: bot-1313  drone
        code: a
        start: {x: 16, y: 8}           # no patrol: stays where a link leaves it
      - id: bot1314
        type: dozer
        name: bot-1314  dozer
        code: none
        start: {x: 1, y: 8}            # in the pen
    things:
      - item: launch_key_4             # the island's cabinet
        at: {x: 12, y: 6}
      - item: code_a3                  # the bench, top left (not in the goal)
        at: {x: 3, y: 1}
    doors:
      - at: {x1: 14, y1: -1, x2: 15, y2: -1}  # top wall opening, back to room 14
        leads_to: room14
        arrive: {y: 10}

  - name: room14                       # left of the hub
    vchar64_map: graphics/titan-map14.s
    label: hops
    player_start: {x: 18, y: 5}
    # The human and the hopper together: the vault's gate (15,2) opens while
    # both plates are loaded. Plate B (16,2) is in the terminal's zone: stand
    # on it and link the hopper. Plate A (2,8) is across the lower field:
    # pit column x 13, the laser at x 9, pit column x 5. Charge (fire held
    # 2 s, standing still), jump the pit and the laser, charge again, jump
    # the last pit, walk onto plate A. Then step from plate B into the gate
    # (that latches it open) and search the cabinet.
    goal: {text: open the vault, done: {gate: room14}}
    robots:
      - id: bot1414
        type: hopper
        name: bot-1414  hopper
        code: a
        start: {x: 17, y: 8}           # no patrol: stays where a link leaves it
    things:
      - item: code_b1
        at: {x: 3, y: 1}
    lasers:
      - {x1: 9, y1: 5, x2: 9, y2: 9}   # across the lower field
    doors:
      - at: {x1: 20, y1: 5, x2: 20, y2: 6}   # right wall opening, back to room 2
        leads_to: room2
        arrive: {x: 0}
      - at: {x1: 14, y1: 11, x2: 15, y2: 11}  # bottom wall opening, to room 13
        leads_to: room13
        arrive: {y: 0}

  - name: room15                       # right of the hub
    vchar64_map: graphics/titan-map15.s
    label: range
    player_start: {x: 1, y: 8}
    # A shooting range: link the sentry in its booth at the left end of the
    # sealed channel on row 5 (a pit keeps it in) and shoot along the
    # channel. Two shutters cross it, opening and closing out of step; a
    # bolt that gets through both hits the target at (16,5), which latches
    # the gate (18,6) open: up the passage into the vault.
    goal: {text: open the vault, done: {gate: room15}}
    robots:
      - id: bot1515
        type: sentry
        name: bot-1515  sentry
        code: a
        attack: shoot                  # driven, fire shoots
        start: {x: 2, y: 5}            # no patrol: it stays in its booth
    shutters:                          # frames (50 a second); a bolt crosses
      - {at: {x: 8, y: 5}, open: 24, closed: 40, first_open: 40}   # a tile in ~5
      - {at: {x: 12, y: 5}, open: 20, closed: 50, first_open: 15}
    things:
      - item: code_a5
        at: {x: 2, y: 1}
    doors:
      - at: {x1: -1, y1: 8, x2: -1, y2: 8}   # left wall opening, back to room 2
        leads_to: room2
        arrive: {x: 19}
      - at: {x1: 20, y1: 8, x2: 20, y2: 8}   # right wall opening, to the lasers
        leads_to: room1
        arrive: {x: 0}

  - name: room16                       # top row, between the plates and the vault
    vchar64_map: graphics/titan-map16.s
    label: switch
    player_start: {x: 10, y: 5}
    # Switches and red/green blocks, kept in time by a "metronome": a dozer
    # on a fenced track (y 1) crosses the switch at (10,1) every lap and flips
    # the room. Right tunnel to the vault (row 5): red, green, red blocks with
    # rest tiles between -- step on as one drops, off before it rises. Left
    # tunnel to the blue door: a switch at (6,5), then seven green blocks
    # (5..2,5 and down x=1 to y=7) -- 56 frames on them, longer than the
    # metronome's short window (~64 frames from flip to flip, dozer right of
    # its switch) but not its long one (~96, dozer left of it): flip your own
    # switch, or wait on it for the greens to drop, right after the dozer
    # crosses heading left. The terminal links the dozer (free) to set the state.
    goal: {text: open the door, done: {opened: room10}}
    robots:
      - type: dozer
        name: bot-1616  dozer
        code: none
        start: {x: 7, y: 1}
        patrol: [{x: 7, y: 1}, {x: 12, y: 1}]   # across the switch at (10,1)
    things:
      - item: code_a8                  # the cabinet, top left (not in the goal)
        at: {x: 1, y: 1}
    doors:
      - at: {x1: 12, y1: 11, x2: 16, y2: 11} # bottom wall opening, to room 6
        leads_to: room6
        arrive: {y: 0}
      - at: {x1: -1, y1: 8, x2: -1, y2: 8}   # left wall: the closed door (0xb0)
        leads_to: room10
        arrive: {x: 19}
        key: blue_card
      - at: {x1: 20, y1: 8, x2: 20, y2: 8}   # right wall opening, to the vault
        leads_to: room8
        arrive: {x: 0}
